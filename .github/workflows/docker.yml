name: Docker Images

# CI 构建并推送镜像到 GHCR，供 `uc deploy --no-build` 直接拉取：
#   IMAGE_TAG=<tag> ./scripts/deploy-uncloud.sh --registry
# type=gha 缓存让 CI 增量构建只需重新编译变化的层。

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Directory.Build.props"
      - ".dockerignore"
      - "src/MesAdmin.Api/Dockerfile"
      - "src/MesAdmin.Web/Dockerfile"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "Directory.Build.props"
      - ".dockerignore"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GHCR 镜像名必须全小写
  IMAGE_PREFIX: ghcr.io/skybuleli/automotive-mes

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mes-api
            dockerfile: src/MesAdmin.Api/Dockerfile
          - name: mes-web
            dockerfile: src/MesAdmin.Web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
